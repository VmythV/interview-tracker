name: 部署到 GitHub Pages

on:
  push:
    branches: [main]
  pull_request: # PR 上只跑检查，不部署
  workflow_dispatch: # 允许在 Actions 页面手动重新部署

permissions:
  contents: read
  pages: write
  id-token: write

# 同时只跑一次部署；新的 push 进来就取消排队中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run test

      # build 里带了 tsc -b，类型不过就不会发布
      - run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    # PR 只验证，不发布
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
